{{ $src := .Get "src" }}
{{ $poster := .Get "poster" }}
{{ $caption := .Get "caption" | default "Click to play" }}
{{ $uuid := delimit (slice "vid" (now.UnixNano)) "" }}

<div class="video-player-wrapper" style="margin: 1rem 0; text-align: center;">
    <video 
        id="{{ $uuid }}" 
        width="100%" 
        poster="{{ $poster | absURL }}" 
        preload="none" 
        style="cursor: pointer; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"
        onclick="if(this.paused) { this.play(); } else { this.pause(); }">
        <source src="{{ $src | absURL }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <p style="font-size: 0.9rem; color: #666; margin-top: 0.5rem;">
        {{ $caption }}
    </p>
</div>

<script>
    (function() {
        var video = document.getElementById('{{ $uuid }}');
        video.onended = function() {
            video.load(); // Resets to the poster image
        };
    })();
</script>
